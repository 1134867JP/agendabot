services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: agendabot-app
    container_name: agendabot-app
    restart: always
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - web
      - default
      - evolution-net
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 5432
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: database
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8

  db:
    image: postgres:16
    container_name: agendabot-db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 6
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  worker:
    image: agendabot-app
    container_name: agendabot-worker
    restart: always
    command: php artisan queue:work --queue=messages,notifications,financial,sync,maintenance,default --sleep=2 --tries=3 --timeout=90
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - default
      - evolution-net
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 5432
      QUEUE_CONNECTION: database

  scheduler:
    image: agendabot-app
    container_name: agendabot-scheduler
    restart: always
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - storage_data:/var/www/html/storage
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 5432

volumes:
  pgdata:
  storage_data:

networks:
  web:
    external: true
  evolution-net:
    external: true
