services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendabot-app
    restart: always
    volumes:
      - .:/var/www/html
    networks:
      - web
      - default
      - evolution-net
    depends_on:
      - db
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: database

  db:
    image: postgres:16
    container_name: agendabot-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendabot-worker
    restart: always
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=45
    volumes:
      - .:/var/www/html
    networks:
      - default
    depends_on:
      - db
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: database

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agendabot-scheduler
    restart: always
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - .:/var/www/html
    networks:
      - default
    depends_on:
      - db
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

volumes:
  pgdata:

networks:
  web:
    external: true
  evolution-net:
    external: true
