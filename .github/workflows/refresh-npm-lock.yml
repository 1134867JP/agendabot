name: Refresh vulnerable npm dependency

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-npm-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Corrigir dependências vulneráveis
        run: npm audit fix

      - name: Validar auditoria npm
        run: npm audit --audit-level=high

      - name: Commit lock seguro
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Nenhuma alteração no package-lock.json foi necessária.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix: update vulnerable npm dependency'
          git push
