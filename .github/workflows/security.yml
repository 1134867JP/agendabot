name: Security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Audit Composer lock
        run: composer audit --locked --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Audit npm lock
        run: npm audit --audit-level=high

  secret-patterns:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reject common committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -IEn '(sk_(live|test)_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,})' -- . ':!tests' ':!*.md'; then
            echo 'Possível segredo encontrado no repositório.'
            exit 1
          fi
