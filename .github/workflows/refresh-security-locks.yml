name: Refresh security locks

on:
  push:
    branches: [agent/harden-security]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/harden-security

      - name: Refresh Composer lock
        run: composer update --with-all-dependencies --no-interaction --no-scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh npm security lock
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Commit refreshed locks
        shell: bash
        run: |
          set -euo pipefail
          git add composer.lock package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza dependências vulneráveis"
          git push origin HEAD:agent/harden-security
