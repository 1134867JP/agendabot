name: CI e deploy para VPS

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read
  pull-requests: write

# Mantém apenas a validação mais recente da mesma branch/PR.
concurrency:
  group: ci-deploy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências JS
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Compartilhar build Vite
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-${{ github.sha }}
          path: public/build
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Backend (${{ matrix.target }})
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        target:
          - unit
          - feature-0
          - feature-1
          - feature-2
          - feature-3

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agendou_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d agendou_testing"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php83-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php83-

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Restaurar build Vite para testes Feature
        if: matrix.target != 'unit'
        uses: actions/download-artifact@v4
        with:
          name: vite-build-${{ github.sha }}
          path: public/build

      - name: Validar estilo PHP
        if: matrix.target == 'unit'
        run: vendor/bin/pint --test

      - name: Preparar ambiente de testes
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Executar testes PHP
        env:
          AI_PROVIDER: claude
          AI_FALLBACK_PROVIDERS: ''
          CLAUDE_API_KEY: testing-key
          TEST_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$TEST_TARGET" = "unit" ]; then
            vendor/bin/phpunit --testsuite=Unit
            exit 0
          fi

          shard="${TEST_TARGET#feature-}"
          total_shards=4
          mapfile -t files < <(
            find tests/Feature -type f -name '*Test.php' \
              | sort \
              | awk -v shard="$shard" -v total="$total_shards" '((NR - 1) % total) == shard'
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nenhum teste encontrado para o shard $shard"
            exit 1
          fi

          echo "Executando shard $((shard + 1))/$total_shards com ${#files[@]} arquivos"

          # Um único processo PHPUnit com muitos Feature tests ficava mais de ~1 min
          # sem emitir saída e o runner hospedado era encerrado com SIGTERM/143.
          # Rodar arquivo a arquivo mantém progresso visível, libera memória entre
          # classes e aponta exatamente qual arquivo travou caso isso volte a ocorrer.
          for file in "${files[@]}"; do
            echo "::group::PHPUnit $file"
            echo "Iniciando $file"

            set +e
            timeout --signal=TERM --kill-after=5s 45s \
              stdbuf -oL -eL vendor/bin/phpunit --testdox "$file"
            status=$?
            set -e

            echo "::endgroup::"

            if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "::error file=$file::Teste excedeu 45s e foi interrompido para não travar o runner."
              exit 1
            fi

            if [ "$status" -ne 0 ]; then
              echo "::error file=$file::PHPUnit falhou com código $status."
              exit "$status"
            fi

            echo "Concluído $file"
          done

  validacao-ia-real:
    name: Validação real de IA
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[testar-fluxos-ia]')
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Executar cenários reais sem WhatsApp
        uses: appleboy/ssh-action@v1.2.5
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: docker exec agendabot-app php artisan bot:testar-fluxos-reais --provider=gemini

  deploy:
    name: Deploy para VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Aguardar SSH disponível (retry até 5x)
        run: |
          for i in 1 2 3 4 5; do
            if nc -z -w 10 ${{ secrets.VPS_HOST }} 22; then
              echo "SSH disponível na tentativa $i"
              exit 0
            fi
            echo "Tentativa $i falhou, aguardando 15s..."
            sleep 15
          done
          echo "SSH não respondeu após 5 tentativas"
          exit 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          envs: COMMIT_MESSAGE
          script: |
            cd /opt/apps/agendabot
            git fetch origin master
            if ! git diff --quiet -- deploy.sh; then
              local_change="$(git diff --summary -- deploy.sh | xargs)"
              remote_mode="$(git ls-tree origin/master deploy.sh | awk '{print $1}')"
              if [ "$local_change" = "mode change 100644 => 100755 deploy.sh" ] && [ "$remote_mode" = "100755" ]; then
                echo "Normalizando permissão local antiga; a master reaplicará o modo 100755."
                chmod 0644 deploy.sh
              else
                echo "::error::A VPS possui alterações locais em deploy.sh; revise o diff antes de atualizar."
                git diff --no-ext-diff -- deploy.sh
                exit 1
              fi
            fi
            bash deploy.sh
            if [[ "$COMMIT_MESSAGE" == *"[diagnose-whatsapp]"* ]]; then
              echo "--- diagnóstico pontual do QR Code ---"
              docker exec agendabot-app sh -c 'grep "WHATSAPP_QRCODE" /var/www/html/storage/logs/laravel.log 2>/dev/null | tail -n 3' || true
            fi
            if [[ "$COMMIT_MESSAGE" == *"[testar-fluxos-ia]"* ]]; then
              echo "--- validação isolada de conversa com IA ---"
              set +e
              resultado="$(docker exec agendabot-app php artisan bot:testar-fluxos-reais --provider=gemini 2>&1)"
              status=$?
              set -e
              echo "$resultado"

              pr="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" | jq -r '.[0].number // empty')"
              if [ -n "$pr" ]; then
                payload="$(jq -n --arg body "## Validação real de IA\n\n\`\`\`text\n${resultado}\n\`\`\`" '{body: $body}')"
                curl -fsSL -X POST -H "Authorization: Bearer ${{ github.token }}" -H 'Accept: application/vnd.github+json' \
                  "https://api.github.com/repos/${{ github.repository }}/issues/${pr}/comments" -d "$payload" >/dev/null
              fi
              exit "$status"
            fi
