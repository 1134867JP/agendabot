name: Deploy para VPS

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  validar:
    name: Validar código
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Validar sintaxe PHP
        run: find app config routes -name "*.php" | xargs php -l | grep -v "^No syntax errors" | (grep . && exit 1 || exit 0)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências JS
        run: npm ci

      - name: Build frontend (TypeScript + Vite)
        run: npm run build

  deploy:
    name: Deploy para VPS
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Aguardar SSH disponível (retry até 5x)
        run: |
          for i in 1 2 3 4 5; do
            if nc -z -w 10 ${{ secrets.VPS_HOST }} 22; then
              echo "SSH disponível na tentativa $i"
              exit 0
            fi
            echo "Tentativa $i falhou, aguardando 15s..."
            sleep 15
          done
          echo "SSH não respondeu após 5 tentativas"
          exit 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            cd /opt/apps/agendabot
            bash deploy.sh
