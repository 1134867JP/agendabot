name: CI e deploy para VPS

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  validar:
    name: Validar código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agendou_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d agendou_testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependências PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Validar sintaxe PHP
        run: find app config routes -name "*.php" | xargs php -l | grep -v "^No syntax errors" | (grep . && exit 1 || exit 0)

      - name: Validar estilo PHP
        run: vendor/bin/pint --test

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências JS
        run: npm ci

      - name: Build frontend (TypeScript + Vite)
        run: npm run build

      - name: Preparar ambiente de testes
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Executar testes PHP
        env:
          AI_PROVIDER: claude
          AI_FALLBACK_PROVIDERS: ''
          CLAUDE_API_KEY: testing-key
        shell: bash
        run: |
          set +e
          php \
            -d display_errors=1 \
            -d display_startup_errors=1 \
            -d log_errors=1 \
            -d error_log=/tmp/agendou-php-tests.log \
            -d error_reporting=E_ALL \
            artisan test
          status=$?

          if [ "$status" -ne 0 ]; then
            echo ""
            echo "=== PHP error log ==="
            if [ -s /tmp/agendou-php-tests.log ]; then
              cat /tmp/agendou-php-tests.log
            else
              echo "Nenhum erro adicional foi gravado pelo PHP."
            fi
          fi

          exit "$status"

  deploy:
    name: Deploy para VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Aguardar SSH disponível (retry até 5x)
        run: |
          for i in 1 2 3 4 5; do
            if nc -z -w 10 ${{ secrets.VPS_HOST }} 22; then
              echo "SSH disponível na tentativa $i"
              exit 0
            fi
            echo "Tentativa $i falhou, aguardando 15s..."
            sleep 15
          done
          echo "SSH não respondeu após 5 tentativas"
          exit 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            cd /opt/apps/agendabot
            if ! git diff --quiet -- deploy.sh; then
              echo "::error::A VPS possui alterações locais em deploy.sh; revise o diff antes de atualizar."
              git diff --no-ext-diff -- deploy.sh
              exit 1
            fi
            bash deploy.sh
