name: Atualizar locks de dependências

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/refresh-composer-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-locks:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-hardening
          fetch-depth: 0

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Auditar dependências PHP
        run: composer audit --locked --no-interaction

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Corrigir lock do frontend
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Auditar dependências do frontend
        run: npm audit --audit-level=high

      - name: Publicar lock atualizado
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Atualiza dependências vulneráveis do frontend"
          git push origin HEAD:agent/security-hardening
